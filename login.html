<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Login / Sign Up </title>
    </head>

    <body>

        <table>
        <tr>
            <td align="center">

                <div class="card" id="loginBox">
                    <h2>Login</h2>
                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Password">
                    <button>Login</button>
                    <div class="switch" onclick="toggle()">Create account</div>
                </div>

                <div class="card" id="signupBox" style="display:none;">
                    <h2>Sign Up</h2>
                    <input type="text" placeholder="Name">
                    <input type="text" placeholder="Company Name">
                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Password">
                    <button align="center" valign="middle">Sign Up</button>
                    <div class="switch" onclick="toggle()">Already have an account?</div>
                </div>

            </td>
        </tr>
        </table>

    </body>
</html>
