<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Login / Sign Up </title>
        <link rel="stylesheet" href="style/login.css">
        <script src="script/login.js"></script>
    </head>

    <body>
        <table>
        <tr>
            <td align="center" valign="middle">

                <div class="card" id="loginBox">
                    <h2>Login</h2>
                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Mot de passe">
                    <button>Login</button>
                    <div class="switch" onclick="toggle()">Crée un compte</div>
                </div>

                <div class="card" id="signupBox" style="display:none;">
                    <h2>Sign Up</h2>
                    <input type="text" placeholder="Name">
                    <input type="text" placeholder="Nom du startup">
                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Mot de passe">
                    <button align="center" valign="middle">Sign Up</button>
                    <div class="switch" onclick="toggle()">Connectez a un compte existant?</div>
                </div>

            </td>
        </tr>
        </table>

    </body>
</html>
